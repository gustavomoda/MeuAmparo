# Pulo: tem queda livre e impacto, mas a pessoa volta a se mexer. Não pode gerar alerta.
# O cenário passa se a fase de imobilidade for interrompida e voltar a idle.
name: 'Pulo não gera alerta'
version: 1
author: 'MeuAmparo'
steps:
  - wait-serial: 'monitorando'
  - delay: 1000ms
  - set-control: { part-id: imu1, name: accelZ, value: 0.1 }
  - delay: 300ms
  - set-control: { part-id: imu1, name: accelZ, value: 3.5 }
  - delay: 60ms
  - set-control: { part-id: imu1, name: accelZ, value: 1 }
  - delay: 800ms
  # voltou a andar: o primeiro passo já tira da imobilidade
  - set-control: { part-id: imu1, name: accelZ, value: 1.6 }
  - wait-serial: 'stillness -> idle'
  - set-control: { part-id: imu1, name: accelZ, value: 1 }
  # mais 12 s parado em pé: passa da janela de cancelamento e não pode sair alerta
  - delay: 12000ms
  - expect-pin: { part-id: esp, name: 2, value: 0 }
